services:
  app:
    build: .
    container_name: lava_jato_app
    ports:
      - "3000:3000"
      - "5555:5555" # Prisma Studio (visualizar o banco), quando for aberto
    environment:
      - PORT=3000
      # Dentro da rede do Docker o banco é acessado pelo nome do serviço ("postgres") na porta 5432
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lavajato_db?schema=public
      - JWT_SECRET=${JWT_SECRET}
      # Admin criado automaticamente ao ligar (valores do .env; senão, estes padrões)
      - ADMIN_NOME=${ADMIN_NOME:-Administrador}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@lavajato.com}
      - ADMIN_SENHA=${ADMIN_SENHA:-admin123}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

  # Tela (React + Vite): http://localhost:5173
  frontend:
    image: node:20-alpine
    container_name: lava_jato_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    environment:
      - API_URL=http://app:3000
      - VITE_POLLING=true
    depends_on:
      - app
    volumes:
      - ./frontend:/app
      - /app/node_modules

  postgres:
    image: postgres:18-alpine
    container_name: lava_jato_postgres
    ports:
      - "2222:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lavajato_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lavajato_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # Postgres 18+ espera o volume em /var/lib/postgresql (não mais em /data)
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
    name: lava_jato_postgres_data
